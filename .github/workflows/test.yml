name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.6'
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.14.2'
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install '.[test]' build
          python -m playwright install --with-deps chromium
      - name: Check generated assets and runtime
        run: |
          bun run check
          bun test tests/runtime.test.js
          bun run build:playground-lib
      - name: Test compilation and exports
        run: python -m unittest discover -s tests -v
      - name: Test the browser runtime and playground
        env:
          GLISSADE_BROWSER_TESTS: '1'
        run: python -m unittest discover -s tests -p test_browser.py -v
      - name: Build distribution and verify installed command
        run: |
          python -m build
          python -m venv /tmp/glissade-installed
          /tmp/glissade-installed/bin/pip install dist/*.whl
          cd /tmp
          /tmp/glissade-installed/bin/glissade --help
          /tmp/glissade-installed/bin/glissade --root "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/site/examples/animate-width.typ" html --fps 2
      - name: Record benchmark
        run: python bin/benchmark.py --slides 20 --fps 12 --browser --output /tmp/glissade-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: /tmp/glissade-benchmark.json
